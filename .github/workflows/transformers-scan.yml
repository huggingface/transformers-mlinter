name: Scan transformers

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      transformers_ref:
        description: 'huggingface/transformers ref to scan'
        required: false
        default: 'main'


permissions: {}

jobs:
  scan:
    permissions:
      contents: read
    name: Run all rules against huggingface/transformers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out mlinter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install .

      - name: Shallow-clone huggingface/transformers
        env:
          TRANSFORMERS_REF: ${{ github.event.inputs.transformers_ref || 'main' }}
        run: |
          git clone --depth 1 --branch "$TRANSFORMERS_REF" \
            https://github.com/huggingface/transformers.git transformers
          git -C transformers rev-parse HEAD > TRANSFORMERS_SHA
          echo "TRANSFORMERS_SHA=$(cat TRANSFORMERS_SHA)" >> "$GITHUB_ENV"
          echo "TRANSFORMERS_REF=$TRANSFORMERS_REF" >> "$GITHUB_ENV"

      # On a pull request, the gate is "no new violations under the default rules": scan the same
      # transformers commit with the base branch's mlinter too, and fail on what this change adds.
      - name: Check out mlinter base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # The base scan runs this change's script against the base package. If it fails (say, a rule on
      # the base crashes and this change fixes it), the scan below reports without a gate.
      - name: Scan with the base branch's default rules
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: transformers
        run: |
          python -m venv "$RUNNER_TEMP/base-venv"
          "$RUNNER_TEMP/base-venv/bin/python" -m pip install ../base
          "$RUNNER_TEMP/base-venv/bin/python" ../scripts/scan_transformers.py \
            --defaults-only "$RUNNER_TEMP/base-defaults.json"

      - name: Run mlinter against transformers
        working-directory: transformers
        run: |
          baseline=()
          if [ -f "$RUNNER_TEMP/base-defaults.json" ]; then
            baseline=(--baseline "$RUNNER_TEMP/base-defaults.json")
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "::warning::The base branch scan failed; reporting without the new-violation gate."
          fi
          python ../scripts/scan_transformers.py --output-dir "$GITHUB_WORKSPACE" "${baseline[@]}"

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transformers-scan-report
          path: |
            scan-report.md
            scan-violations.txt
            TRANSFORMERS_SHA
