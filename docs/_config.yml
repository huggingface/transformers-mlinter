# Jekyll configuration for the mlinter documentation site.
#
# The site source is this `docs/` directory — the Gemfile lives here too, so the whole site is
# self-contained and nothing at the repo root is at risk of being served by accident. Build it with
# `make docs` (which also regenerates the rule pages) or `make docs-serve` for a live preview.
title: mlinter
description: >-
  A linter for Hugging Face Transformers model integration files. Enforces the structural
  conventions that keep modeling, configuration and processing code consistent across the library.

theme: just-the-docs

# The logo is a full lockup — the mark and the "MLinter" wordmark together — so it stands in for the
# site title text in the sidebar header rather than sitting beside it (see _includes/title.html, which
# overrides the theme's own to render an <img> the header can size properly).
logo: "/assets/images/mlinter-logo.png"

# Social preview image for jekyll-seo-tag (og:image / twitter:image). This has to be set per page —
# jekyll-seo-tag reads `image` off the page, not the site — so a default supplies it everywhere rather
# than every page (including the 57 generated ones) having to carry it in front matter.
defaults:
  - scope:
      path: ""
    values:
      image: "/assets/images/mlinter-logo.png"

# The repo is public, so Pages serves the site from the org's github.io host under the repo path.
# `url` + `baseurl` must compose into a URL that actually serves, because absolute_url builds the SEO
# and JSON-LD metadata from them. The Pages workflow passes --baseurl from actions/configure-pages so
# CI stays correct even if this drifts; these two values are what a local `jekyll serve` uses.
url: https://huggingface.github.io
baseurl: /transformers-mlinter

# Rule pages cross-reference each other and the hand-written pages by relative .md path, which is
# also how they read on github.com. This rewrites those links to their rendered permalinks so the
# same paths work on the built site.
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

# /rules/ and /rules/trf001/ rather than /rules.html — the rule index is docs/rules/index.md and the
# rule pages are its siblings, so pretty permalinks nest them without colliding.
permalink: pretty

# Jekyll copies every non-excluded file into _site verbatim. Only the Ruby toolchain files need
# excluding here: everything else under docs/ is meant to be a page.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle

# ── just-the-docs ─────────────────────────────────────────────────────────────
color_scheme: light

search_enabled: true
search:
  heading_level: 3
  previews: 3
  # Rule prose is full of dotted and slashed identifiers (`config.hidden_act`,
  # `src/transformers/models`). Splitting on those as well as whitespace makes the parts searchable,
  # so a reader looking for "hidden_act" finds the rule that mentions it.
  tokenizer_separator: /[\s/]+/

heading_anchors: true

aux_links:
  "GitHub":
    - "https://github.com/huggingface/transformers-mlinter"
  "PyPI":
    - "https://pypi.org/project/transformers-mlinter/"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Apache-2.0 licensed. Part of the Hugging Face Transformers toolchain.

# Rule pages are generated, so an "edit this page" link would point at a file that does not exist in
# the repo. The rule pages instead link to their own rule module and say where the prose lives; this
# link is for the hand-written pages.
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/huggingface/transformers-mlinter"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
